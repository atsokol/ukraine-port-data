# Full rebuild: re-downloads every source file and regenerates the dataset from
# scratch. Manual only - it makes ~77 requests to a rate-limited source. Routine
# refreshes are handled by update.yml.
name: Full Data Rebuild (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

# Never let a rebuild and a scheduled update push at the same time.
concurrency:
  group: port-data-write
  cancel-in-progress: false

jobs:
  rebuild-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true  # faster installs

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: |
            any::readr
            any::dplyr
            any::jsonlite
            any::httr
            any::lubridate
            any::readxl
            any::purrr

      - name: Rebuild dataset
        run: Rscript scripts/data_download.R

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data inputs
          git commit -m 'Data rebuilt' || echo "No changes to commit"
          git push origin || echo "Nothing to push"
