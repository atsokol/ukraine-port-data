# Incremental refresh: downloads only the source files that are new or have been
# re-uploaded since the last run. Cheap enough to run weekly; the source
# publishes a new month around the 10th-15th.
name: Weekly Data Update

on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# Never let a scheduled update and a manual rebuild push at the same time.
concurrency:
  group: port-data-write
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true  # faster installs

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: |
            any::readr
            any::dplyr
            any::jsonlite
            any::httr
            any::lubridate
            any::readxl
            any::purrr

      - name: Update dataset
        run: Rscript scripts/data_update.R

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data inputs
          git commit -m 'Data updated' || echo "No changes to commit"
          git push origin || echo "Nothing to push"
